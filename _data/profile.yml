short_bio: >-
  <p>
    Hey! I'm Shreyas. I'm a Masters' student (Dual Degree B.Tech. + M.Tech.) at the Center for Systems and Controls,
    Indian Institute of Technology Bombay, India. I finished my B.Tech. in Aerospace Engineering in April 2025.
    My research interests include geometric mechanics, control theory, optimization on manifolds, and nonlinear dynamical systems.
  </p>
  <p>
    I also love hands-on projects, especially real-world applications involving aerial robotics, aeroelasticity, and control systems. I've recently also started working on data-driven control, and I'm a coffee buff :)
  </p>

